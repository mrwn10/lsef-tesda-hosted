<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TESDA LSEF</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/all/login.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/lsef_logo.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <div class="logo-container">
                    <img src="{{ url_for('static', filename='img/lsef_logo.png') }}" alt="LSEF Logo" class="logo">
                    <img src="{{ url_for('static', filename='img/tesda_logo.png') }}" alt="TESDA Logo" class="logo">
                </div>
                <h1>Welcome to TESDA LSEF</h1>
                <p>Please sign in to access your account</p>
            </div>

            <!-- JavaScript messages container -->
            <div id="js-message-container" class="js-message-container" style="display: none;">
                <div class="js-message">
                    <span class="js-message-icon">
                        <i class="fas fa-check-circle"></i>
                    </span>
                    <span class="js-message-text"></span>
                    <button class="js-message-close" aria-label="Close message">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>

            <form class="login-form" id="loginForm" autocomplete="on">
                <div class="form-group">
                    <label for="identifier">
                        <i class="fas fa-user"></i> Username or Email
                    </label>
                    <div class="input-wrapper">
                        <input type="text" id="identifier" name="identifier" placeholder="Enter your username or email" required autofocus>
                        <i class="fas fa-user input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        <i class="fas fa-lock input-icon"></i>
                        <button type="button" class="toggle-password" aria-label="Show password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="forgot-password">
                        <a href="{{ url_for('forgot_password') }}">
                            <i class="fas fa-question-circle"></i> Forgot password?
                        </a>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-loader">
                        <i class="fas fa-spinner fa-spin"></i>
                    </span>
                </button>

                <div class="divider">
                    <span>or</span>
                </div>

                <div class="auth-links">
                    <div class="auth-link">
                        Don't have an account? <a href="{{ url_for('register') }}"><i class="fas fa-user-plus"></i> Register here</a>
                    </div>
                    <div class="auth-link">
                        <a href="{{ url_for('landing') }}"><i class="fas fa-arrow-left"></i> Back to Landing page</a>
                    </div>
                </div>
            </form>
        </div>

    <!-- JavaScript Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/all/login.js') }}"></script>
</body>
</html>
